name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install encrypted database build dependencies
        if: matrix.project == 'backend'
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Lint development harness
        if: matrix.project == 'backend'
        run: npm run lint:dev-caddy --prefix ..

      - name: Test development lifecycle safety
        if: matrix.project == 'backend'
        run: npm run test:dev-caddy --prefix ..

      - name: Run tests
        run: npm test

  test-required:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, auth-integration]
    if: always()
    steps:
      - name: Verify test matrix
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.auth-integration.result }}" != "success" ]]; then
            echo "Test matrix/auth integration did not complete successfully: ${{ needs.test.result }} / ${{ needs.auth-integration.result }}"
            exit 1
          fi


  auth-integration:
    name: Authentication integration (HTTPS and Caddy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install encrypted database build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install application dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Prepare frontend and Chromium
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps chromium

      - name: Verify real HTTPS authentication and selected Caddy instances
        env:
          CADDY_UI_TEST_DOCKER: 'true'
        run: npm run test:auth-browser --prefix frontend

      - name: Verify proxy trust and generated Compose deployment
        run: npm run test:auth-proxy

      - name: Lint authentication integration harness
        run: npm run lint:auth

      - name: Build deployment images
        run: |
          docker build --tag caddy-ui-backend:auth-test backend
          docker build --tag caddy-ui-frontend:auth-test frontend

      - name: Verify encrypted storage and password hashing in the runtime image
        run: |
          docker run --rm --interactive \
            --tmpfs /auth:mode=0700 --tmpfs /keys:mode=0700 \
            caddy-ui-backend:auth-test node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { authConfig } from './src/auth/config.js';
          import { openAuth } from './src/auth/service.js';
          const config = authConfig({ CADDY_UI_AUTH_DATA_PATH: '/auth', CADDY_UI_AUTH_KEY_PATH: '/keys/database.key' });
          const auth = await openAuth(config);
          try {
            await auth.claim({ code: await auth.setupCode(), username: 'admin', password: 'runtime-image-test-password' });
            const login = await auth.login('admin', 'runtime-image-test-password');
            assert.equal((await auth.session(login.token)).user.username, 'admin');
            assert(!(await readFile('/auth/auth.sqlite')).includes(Buffer.from('runtime-image-test-password')));
            process.stdout.write('SQLCipher and Argon2id runtime-image check passed\n');
          } finally { await auth.close(); }
          NODE

  lint:
    runs-on: ubuntu-latest
    name: Lint (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install encrypted database build dependencies
        if: matrix.project == 'backend'
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: ${{ matrix.project == 'frontend' && 'npm run lint -- --max-warnings=0' || 'npm run lint' }}

